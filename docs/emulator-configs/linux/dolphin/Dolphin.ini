[Analytics]
Enabled = False
PermissionAsked = True

[Display]
Fullscreen = False
RenderToMain = False
RenderWindowXPos = -1
RenderWindowYPos = -1
RenderWindowWidth = 800
RenderWindowHeight = 480
RenderWindowAutoSize = False

[Core]
# Dual Core without GPU sync desyncs on the Pi (GFX FIFO: Unknown Opcode).
SyncGPU = True

[DSP]
# Mario Kart: Double Dash stuttered a little with no PipeWire underruns:
# Dolphin's own mixer ran dry on short speed dips. Time-stretching covers
# them, as DuckStation does (docs/raspberry-pi-benchmarks.md).
AudioStretch = True
