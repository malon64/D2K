[Analytics]
Enabled = False
PermissionAsked = True

[Display]
Fullscreen = False
RenderToMain = False
RenderWindowXPos = -1
RenderWindowYPos = -1
RenderWindowWidth = 800
RenderWindowHeight = 480
RenderWindowAutoSize = False

[Core]
# Dual Core without GPU sync desyncs on the Pi (GFX FIFO: Unknown Opcode).
SyncGPU = True

[DSP]
# Mario Kart: Double Dash stuttered a little with no PipeWire underruns:
# Dolphin's own mixer ran dry on short speed dips. Time-stretching covers
# them, as DuckStation does (docs/emulators.md).
AudioStretch = True

[Interface]
# Leaving a game (Alt+F4, Escape) otherwise asks for confirmation first.
ConfirmStop = False

[Input]
# Dolphin ignores keys while it thinks its render window is unfocused. When
# it booted fast, the launcher focused the window ~1 s after start and every
# key (Start included) was ignored, though X reported the window active.
BackgroundInput = True
