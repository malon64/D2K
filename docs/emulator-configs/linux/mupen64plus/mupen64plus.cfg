[UI-Console]
VideoPlugin = "mupen64plus-video-rice.so"
AudioPlugin = "mupen64plus-audio-sdl.so"
InputPlugin = "mupen64plus-input-sdl.so"
RSPPlugin = "mupen64plus-rsp-hle.so"

[Video-General]
Fullscreen = False
VerticalSync = False

[Video-Rice]
ShowFPS = False

# With AUDIO_SYNC the audio plugin paces the emulator on its own buffer, and
# with PipeWire's small buffers it held Super Mario 64 at ~40 of 50 VI/s with
# stuttering sound while the CPU idled. Off, the core's VI limiter paces it:
# 50 VI/s, 0 underruns (docs/raspberry-pi-benchmarks.md).
[Audio-SDL]
AUDIO_SYNC = False

[Input-SDL-Control1]
# 0 = manual: in the default automatic mode (2) the plugin ignores these keys.
mode = 0
X Axis = "key(276,275)"
Y Axis = "key(273,274)"
A Button = "key(262)"
B Button = "key(258)"
Z Trig = "key(257)"
L Trig = "key(263)"
R Trig = "key(265)"
Start = "key(13)"
C Button U = "key(105)"
C Button L = "key(106)"
C Button D = "key(107)"
C Button R = "key(108)"
DPad U = "key(116)"
DPad L = "key(102)"
DPad D = "key(103)"
DPad R = "key(104)"
