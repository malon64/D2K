; D2K PSP display overlay. Merge into PSP/SYSTEM/ppsspp.ini.
; The Linux launcher owns the final window rectangle.

[General]
AutoRun = True
WindowWidth = 800
WindowHeight = 480
WindowSizeState = 0
ShowMenuBar = True

[Graphics]
GraphicsBackend = 3 (VULKAN)
DisplayCropTo16x9 = False
VerticalSync = True
MultiThreading = True
ShaderCache = True

[DisplayLayout.Landscape]
DisplayStretch = False
DisplayOffsetX = 0.500000
DisplayOffsetY = 0.500000
DisplayScale = 1.000000
DisplayIntegerScale = False
DisplayAspectRatio = 1.000000
IgnoreScreenInsets = True
[Sound]
; The default 256-sample buffer (2.7 ms at 44.1 kHz) underran ~9 times a
; minute and FillAudioGaps turned each gap into audible glitches
; (docs/emulators.md).
ExtraAudioBuffering = True
