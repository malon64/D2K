[Renderer]
resolution_factor\default=false
resolution_factor=1
use_integer_scaling\default=false
use_integer_scaling=false
async_shader_compilation\default=false
async_shader_compilation=true
; Keep the direct SPIR-V generator. The GLSL path (false) was tried for the
; long shadows in Super Mario 3D Land: it left the game on its title screen,
; both pipeline workers at 100%, for over 4 minutes
; (docs/emulators.md).
spirv_shader_gen\default=false
spirv_shader_gen=true
; Keep hardware vertex shading. Software shading (false) was tried for the
; black shadow columns in Super Mario 3D Land: they stayed (a V3DV shadow
; rendering problem, not vertex precision), and the emulation
; thread hit 99% with a lower frame rate, though pipeline compiling stopped.
use_hw_shader\default=false
use_hw_shader=true

[Audio]
; 1 = Null: no game here uses the 3DS microphone, and the Auto input stream
; underran constantly.
input_type\default=false
input_type=1

[Layout]
