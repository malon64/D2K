[Main]
HideMainWindowWhenRunning = true
RenderToSeparateWindow = true
StartFullscreen = false
; Closing the game window (Alt+F4) otherwise opens a confirmation dialog
; behind the fullscreen game, and the game looks like it ignores the key.
ConfirmPowerOff = false

[UI]
DisplayWindowWidth = 800
DisplayWindowHeight = 480

[Display]
ShowFPS = false
ShowFrameTimes = false
ShowSpeed = false

[Pad1]
; Each button: the keyboard key, then the D2K Controls pad (SDL-0).
Up = Keyboard/UpArrow
Up = SDL-0/DPadUp
Down = Keyboard/DownArrow
Down = SDL-0/DPadDown
Left = Keyboard/LeftArrow
Left = SDL-0/DPadLeft
Right = Keyboard/RightArrow
Right = SDL-0/DPadRight
Triangle = Keyboard/Numpad8
Triangle = SDL-0/X
Square = Keyboard/Numpad4
Square = SDL-0/Y
Circle = Keyboard/Numpad6
Circle = SDL-0/A
Cross = Keyboard/Numpad2
Cross = SDL-0/B
L1 = Keyboard/Numpad7
L1 = SDL-0/LeftShoulder
R1 = Keyboard/Numpad9
R1 = SDL-0/RightShoulder
L2 = Keyboard/Numpad1
L2 = SDL-0/+LeftTrigger
R2 = Keyboard/Numpad3
R2 = SDL-0/+RightTrigger
Start = Keyboard/Enter
Start = SDL-0/Start
Select = Keyboard/Backspace
Select = SDL-0/Back
LUp = Keyboard/I
LLeft = Keyboard/J
LDown = Keyboard/K
LRight = Keyboard/L
